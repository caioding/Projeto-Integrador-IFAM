plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.greenpi.monitor'
    compileSdk 34
    // NDK usado para compilar a camada nativa de acesso ao barramento I2C.
    ndkVersion '30.0.14904198'

    defaultConfig {
        applicationId "com.greenpi.monitor"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags ''
                // A Raspberry Pi 5 (AOSP) e o emulador em Apple Silicon sao arm64;
                // x86_64 e mantido para emuladores em maquinas Intel.
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Cliente MQTT usado para publicar a telemetria no ThingsBoard.
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    testImplementation 'junit:junit:4.13.2'
}
