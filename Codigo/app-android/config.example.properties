# Modelo de configuracao do aplicativo GreenPi Monitor.
#
# IMPORTANTE: nenhum destes valores fica gravado no codigo-fonte. Eles sao
# digitados na tela "Configuracoes" do proprio aplicativo e guardados em
# SharedPreferences, no armazenamento privado do app. Este arquivo serve apenas
# como referencia do que precisa ser preenchido.

# Endereco do servidor ThingsBoard na rede local.
# Use o IP da maquina que roda a plataforma, nunca "localhost": a Raspberry Pi
# precisa alcancar o servidor pela rede.
host=192.168.0.8

# Porta do broker MQTT (uplink da telemetria).
mqtt_port=1883

# Porta HTTP da API REST (consulta do historico e do painel).
http_port=8080

# Token de acesso do dispositivo, gerado pelo ThingsBoard.
# Obtido com "python3 provisionar_thingsboard.py" ou em
# Entities > Devices > GreenPi-RPi5 > Manage credentials.
access_token=COLOQUE-AQUI-O-TOKEN-DO-DISPOSITIVO

# Nome do dispositivo cadastrado na plataforma.
device_name=GreenPi-RPi5

# Intervalo entre publicacoes, em segundos.
interval_seconds=10

# Fator k da compensacao termica: T_real = T_sensor - (T_cpu - T_sensor) / k
# Quanto MENOR o k, MAIOR a correcao aplicada. Calibre comparando a leitura do
# app com um termometro de referencia no mesmo ambiente.
thermal_factor=1.6

# Credenciais de leitura do painel (usadas apenas para consultar o historico).
tenant_user=tenant@thingsboard.org
tenant_password=COLOQUE-AQUI-A-SENHA-DO-TENANT
